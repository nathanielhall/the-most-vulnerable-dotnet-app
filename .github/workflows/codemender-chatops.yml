name: CodeMender ChatOps Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  chatops-remediation:
    # Trigger only if comment starts with a slash command on an active Pull Request
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Dynamically resolve the PR branch so CodeMender acts on the correct code
      - name: Resolve PR Branch details
        id: pr-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Request only 'headRefName' to ensure maximum compatibility with the gh CLI
          PR_INFO=$(gh pr view ${{ github.event.issue.number }} --json headRefName)
          BRANCH=$(echo "$PR_INFO" | jq -r '.headRefName')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          
      - name: Switch to PR Branch
        run: |
          git fetch origin ${{ steps.pr-metadata.outputs.branch }}
          git checkout ${{ steps.pr-metadata.outputs.branch }}

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Download CodeMender CLI
      - name: Install CodeMender CLI
        run: |
          gcloud artifacts generic download \
            --project=cmoc-prod \
            --location=us \
            --repository=codemender-cli-production \
            --package=cm \
            --version=stable \
            --name=cm-linux-amd64.zip \
            --destination=./
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm

      # 4. Restore the branch-specific SQLite database from GCS
      - name: Restore Session State from GCS
        run: |
          mkdir -p ~/.codemender
          gcloud storage cp gs://${{ secrets.GCS_STATE_BUCKET }}/states/${{ steps.pr-metadata.outputs.branch }}/state.db ~/.codemender/state.db || cm init

      # 5. Configure Git Identity
      - name: Configure Git Identity
        run: |
          git config --global user.name "CodeMender ChatOps Bot"
          git config --global user.email "codemender-bot@google.com"

      # 6. Parse and Execute Command
      - name: Parse and Execute ChatOps Command
        id: execute-cmd
        run: |
          COMMENT_BODY="${{ github.event.comment.body }}"
          COMMAND=$(echo "$COMMENT_BODY" | awk '{print $1}')
          FINDING_ID=$(echo "$COMMENT_BODY" | awk '{print $2}')
          
          # Re-initialize the CodeMender config for the runner env
          cat <<EOF > ~/.codemender/config.yaml
          project_paths:
            - "$GITHUB_WORKSPACE"
          vcs:
            type: "git"
            commands:
              reset: "git checkout HEAD -- ."
          build:
            command: "echo 'Skipping tests for demo purposes' && true"
          tools:
            confirm_commands: false
            confirm_writes: false
          EOF

          if [ "$COMMAND" == "/verify" ]; then
            echo "🧪 Verifying finding: $FINDING_ID using Gemini 3.1 Pro..."
            cm find verify "$FINDING_ID" --model gemini-3.1-pro-preview --bypass-warning -y 2>&1 | tee verify_output.log
            echo "cmd_type=verify" >> $GITHUB_OUTPUT
            
          elif [ "$COMMAND" == "/fix" ]; then
            echo "🩹 Generating patch for: $FINDING_ID using Gemini 3.1 Pro..."
            cm fix "$FINDING_ID" --model gemini-3.1-pro-preview --bypass-warning -y 2>&1 | tee fix_output.log
            echo "cmd_type=fix" >> $GITHUB_OUTPUT
            echo "finding_id=$FINDING_ID" >> $GITHUB_OUTPUT
          fi

      # 7. Persist Updated Session State back to GCS
      - name: Persist Session State back to GCS
        if: always()
        run: |
          gcloud storage cp ~/.codemender/state.db gs://${{ secrets.GCS_STATE_BUCKET }}/states/${{ steps.pr-metadata.outputs.branch }}/state.db

      # 8. Post visual results back to the PR comment thread
      - name: Comment Results on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            if ('${{ steps.execute-cmd.outputs.cmd_type }}' === 'verify') {
              const logs = fs.readFileSync('verify_output.log', 'utf8');
              body = `### 🧪 CodeMender Verification Results\n\`\`\`\n${logs}\n\`\`\``;
            } else if ('${{ steps.execute-cmd.outputs.cmd_type }}' === 'fix') {
              const logs = fs.readFileSync('fix_output.log', 'utf8');
              body = `### 🩹 CodeMender Patch Applied\n\`\`\`\n${logs}\n\`\`\`\n\nFix applied to branch. Please pull changes locally or review commit diffs in this PR.`;
            }
            if (body) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      # 9. Push the patch changes back to the PR head branch (Only for fixes)
      - name: Commit and Push Code Changes (For Fixes)
        if: steps.execute-cmd.outputs.cmd_type == 'fix'
        run: |
          git add .
          git commit -m "security: apply automated patch for ${{ steps.execute-cmd.outputs.finding_id }}"
          git push origin ${{ steps.pr-metadata.outputs.branch }}

      # 10. Clean up sensitive runner binaries
      - name: Cleanup
        if: always()
        run: |
          rm -f cm-linux-amd64.zip
          rm -f cm
          rm -rf .cm_project
          rm -rf .exploit/
